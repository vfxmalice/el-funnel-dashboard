he problems.\n\n### 5.1 \u2014 Pre-Scale Checklist\n\nALL of the following must be TRUE:\n\n- [ ] 14-day rolling CPSS has been within KPI for 14+ consecutive active days\n- [ ] Close Rate is \u2265 15% over 20+ Calls Taken (if data exists; if not, flag gap)\n- [ ] Show Rate is \u2265 50% (if data is sufficiently logged)\n- [ ] ROAS is \u2265 1.5x on a 30-day basis (if data exists)\n- [ ] Calendar capacity: enough slots to absorb more calls (max 6\u20138 calls/day per rep)\n- [ ] Creative diversity: at least 3\u20135 active winning creatives\n\n### 5.2 \u2014 Non-Linear Scaling Factors\n\n**Scaling is NOT just \"spend more money.\"** Increasing input without adjusting processes breaks the system.\n\n| Factor | What Breaks | How To Detect From Sheet | Prevention |\n|---|---|---|---|\n| Audience saturation | Same people see same ads \u2192 CPM rises, CTR drops | Frequency climbing > 2.5; CPM rising while Reach plateaus | Launch new creative, test new audiences |\n| Creative fatigue | Winning ads decay | CTR declining week-over-week for 3+ weeks | Always have new creative in pipeline (Petri Dish) |\n| Calendar capacity | More bookings but nowhere to put them | Books Set For Today climbing while Show Rate drops | Add sales reps BEFORE scaling |\n| Sales rep burnout | Close Rate drops as volume increases | Close Rate declining as Calls Taken per day increases | Cap at 6\u20138 calls/day per rep |\n| Lead quality dilution | Broader audiences = less qualified leads | App% or Close Rate declining while Leads increase | Tighten creative messaging or add qualification |\n\n### 5.3 \u2014 Scaling Methodology\n\n```\nSTEP 1: INCREASE BUDGET INCREMENTALLY\n- Increase daily spend by 15\u201325% every 3\u20135 days.\n- Do NOT double overnight \u2014 destabilises Meta's algorithm.\n- Monitor 7d rolling CPSS during scale. If it rises > 30% above KPI\n  for 3+ consecutive days, pause the increase and diagnose.\n\nSTEP 2: SCALE CREATIVE, NOT JUST SPEND\n- For every budget increase, launch at least 2 new creative variations.\n- Winning creative stays untouched in its existing ad set.\n- New variations go into separate ad sets within the same CBO campaign.\n\nSTEP 3: EXPAND AUDIENCES GRADUALLY\n- Start with lookalikes of best converters.\n- Layer in broader interest-based audiences only after LALs saturate.\n- Never go fully broad until spending > \u00a3500/day with proven creative.\n\nSTEP 4: MONITOR DOWNSTREAM WEEKLY\n- As spend increases, track Show Rate and Close Rate weekly.\n- If either degrades > 15% from baseline, STOP scaling and investigate.\n```\n\n### 5.4 \u2014 Scaling Decision Table\n\n| Current Daily Spend | CPSS Status | Creative Pipeline | Action |\n|---|---|---|---|\n| < \u00a350/day | In KPI | 1\u20132 creatives | Scale to \u00a375\u2013100/day. Launch 3+ new creatives. |\n| \u00a350\u2013150/day | In KPI | 3\u20135 creatives | Scale to \u00a3150\u2013200/day in 20% increments. |\n| \u00a3150\u2013300/day | In KPI | 5+ creatives | Scale to \u00a3300\u2013500/day. Add sales rep if needed. |\n| Any | Out of KPI | Any | DO NOT SCALE. Return to Section 3. |\n| Any | In KPI | Only 1 creative | DO NOT SCALE. Build creative pipeline first. |\n\n---\n\n## 6. ENTROPY & ONGOING MAINTENANCE\n\n### 6.1 \u2014 Entropy Signals (Detectable From Sheet Data)\n\n| Signal | How To Detect | Meaning |\n|---|---|---|\n| Creative fatigue | 7d rolling CTR declining 3+ consecutive weeks | Ads are going stale. Launch new creative. |\n| Audience saturation | Frequency rising above 2.5; Reach declining while Impressions hold | Same people seeing ads too many times. |\n| CPM inflation | 7d CPM consistently above 30d CPM by 20%+ | Auction competition up, or saturation. |\n| Lead quality decay | App% or Close Rate declining while LP% stays stable | Funnel is attracting less qualified people. |\n| Offer fatigue | Close Rate declining over 30+ days with stable lead quality | Market may be tiring of the offer. Review positioning. |\n\n### 6.2 \u2014 Maintenance Cadence\n\n| Frequency | Action |\n|---|---|\n| Daily | Ensure all metrics are logged in the sheet. Review CPSS. |\n| Weekly | Calculate all 7-day rolling metrics. Compare to prior week. Check Frequency. |\n| Bi-weekly | Full diagnostic cascade (Section 3). Review NOTES for changes. |\n| Monthly | Full funnel audit. Calculate ROAS. Assess creative portfolio health. |\n| Quarterly | Review offer, positioning, market conditions. Update KPI benchmarks if needed. |\n\n### 6.3 \u2014 The Flowing River Rule\n\nNever stop inputting new strangers into the system. If spend pauses, expect a 2\u20134 week ramp-up period when restarting. The leads generated this week are the calls booked next week and the clients closed in 2\u20134 weeks. Stopping the flow creates a delayed revenue collapse.\n\n---\n\n## 7. EDGE CASES & SPECIAL RULES\n\n### 7.1 \u2014 When Multiple Metrics Are Out of KPI\n\nFix the EARLIEST bottleneck in the funnel first. A broken landing page starves every downstream metric of data, making it impossible to assess whether the VSL, show rate, or close rate are truly broken or just data-starved.\n\n### 7.2 \u2014 When Close Rate Collapses But Everything Else Looks Fine\n\nAlmost always one of three things:\n1. **Lead quality shifted** \u2014 check NOTES for creative/targeting changes around the time close rate dropped.\n2. **Sales rep regression to the mean** \u2014 check their 30-day average, not 7-day.\n3. **Offer-market fit erosion** \u2014 new objections emerging on calls.\n\n### 7.3 \u2014 When CPSS Is In KPI But ROAS Is Not\n\nCalls are cheap but not converting to revenue. Bottleneck is sales, not marketing. Do NOT touch ads or funnel. Focus entirely on call recordings, objection handling, follow-up process, and payment plan availability.\n\n### 7.4 \u2014 Minimum Time Before Judging A Change\n\n| Change Made | Minimum Wait |\n|---|---|\n| New creative launched | 5\u20137 days AND 5,000+ impressions |\n| New landing page headline | 7 days AND 500+ clicks |\n| New VSL | 10\u201314 days AND 100+ leads |\n| New nurture sequence | 14 days AND 30+ calls booked through it |\n| New sales script | 20+ calls taken using it |\n| Budget increase | 5\u20137 days at new spend level |\n\n### 7.5 \u2014 When Data Logging Is Too Sparse To Diagnose\n\nIf the agent cannot produce a confident diagnosis because of missing data (especially Calls Taken, New Clients, Revenue), it must say so explicitly and recommend specific logging improvements before re-analysis. The agent should NEVER fabricate confidence from insufficient data.\n\nRecommended minimum logging standard for the operator:\n- **Every day ads are running:** All columns through CPSS must be filled.\n- **Every day calls are scheduled:** Books Set For Today AND Calls Taken must both be filled (even if Calls Taken = 0 because no one showed).\n- **Every day a client is signed:** New Clients, Revenue, and Cash must be filled on the day the deal closes.\n\n---\n\n## 8. QUICK-REFERENCE DECISION FLOWCHART\n\n```\nSTART\n  \u2502\n  \u25bc\n[CLEAN DATA: Strip \u00a3, commas, %. Exclude \u00a30 spend days. Handle blanks as null.]\n  \u2502\n  \u25bc\n[CALCULATE ALL ROLLING METRICS (Section 1.6)]\n  \u2502\n  \u25bc\n[POLARIS CHECK: 14d rolling CPSS within KPI?]\n  \u2502\n  \u251c\u2500\u2500 YES \u2500\u2500\u25ba [Is downstream data sufficient?]\n  \u2502            \u251c\u2500\u2500 YES, Close% + ROAS healthy \u2500\u2500\u25ba SCALE (Section 5)\n  \u2502            \u2514\u2500\u2500 NO, sparse data \u2500\u2500\u25ba Flag gap. Cautious scaling only.\n  \u2502\n  \u2514\u2500\u2500 NO \u2500\u2500\u25ba BEGIN DIAGNOSTIC CASCADE\n              \u2502\n              \u25bc\n            [Stage 1: CPM + CTR + Frequency]\n              \u251c\u2500\u2500 Problem? \u2500\u2500\u25ba Fix creative / targeting\n              \u2514\u2500\u2500 OK \u2500\u2500\u25ba\n                         [Stage 2: LP%]\n                           \u251c\u2500\u2500 Problem? \u2500\u2500\u25ba Headline test\n                           \u2514\u2500\u2500 OK \u2500\u2500\u25ba\n                                      [Stage 3: Decompose VCR%]\n                                        \u251c\u2500\u2500 App% low? \u2500\u2500\u25ba VSL opening + setter\n                                        \u251c\u2500\u2500 AtB% low? \u2500\u2500\u25ba Calendar fixes + follow-up\n                                        \u2514\u2500\u2500 OK \u2500\u2500\u25ba\n                                                   [Stage 4: Show Rate]\n                                                     \u251c\u2500\u2500 Problem? \u2500\u2500\u25ba Nurture + reminders\n                                                     \u2514\u2500\u2500 OK \u2500\u2500\u25ba\n                                                                [Stage 5: Close Rate]\n                                                                  \u251c\u2500\u2500 Problem? \u2500\u2500\u25ba Call review\n                                                                  \u2514\u2500\u2500 OK \u2500\u2500\u25ba Check data validity.\n                                                                              Consider offer fit.\n```\n\n---\n\n## APPENDIX A: COMPLETE METRIC DERIVATION REFERENCE\n\nEvery metric the agent uses, with the exact columns and formulas.\n\n| Metric | Type | Formula | Source Columns |\n|---|---|---|---|\n| CPM | Read from sheet (or calculate) | (Adspend \u00f7 Impressions) \u00d7 1000 | Col 2, Col 3 |\n| CTR | Read from sheet (or calculate) | (Clicks \u00f7 Impressions) \u00d7 100 | Col 6, Col 3 |\n| CPC | Read from sheet (or calculate) | Adspend \u00f7 Clicks | Col 2, Col 6 |\n| LP% | Read from sheet (or calculate) | (Leads \u00f7 Clicks) \u00d7 100 | Col 9, Col 6 |\n| CPL | Read from sheet (or calculate) | Adspend \u00f7 Leads | Col 2, Col 9 |\n| VCR% | Read from sheet (or calculate) | (Calls Booked \u00f7 Leads) \u00d7 100 | Col 13, Col 9 |\n| CPSS | Read from sheet (or calculate) | Adspend \u00f7 Calls Booked | Col 2, Col 13 |\n| **App%** | **Agent must derive** | (Typeform Apps \u00f7 Leads) \u00d7 100 | Col 12, Col 9 |\n| **AtB%** | **Agent must derive** | (Calls Booked \u00f7 Typeform Apps) \u00d7 100 | Col 13, Col 12 |\n| **Show%** | **Agent must derive** | (Calls Taken \u00f7 Books Set For Today) \u00d7 100 | Col 17, Col 16 |\n| **Close%** | **Agent must derive** | (New Clients \u00f7 Calls Taken) \u00d7 100 | Col 18, Col 17 |\n| **ROAS** | **Agent must derive** | Revenue \u00f7 Adspend | Col 19, Col 2 |\n| **Cash ROAS** | **Agent must derive** | Cash \u00f7 Adspend | Col 20, Col 2 |\n| **Frequency** | **Agent must derive** | Impressions \u00f7 Reach | Col 3, Col 4 |\n\n**For all rolling calculations:** Sum numerator over window. Sum denominator over window. Divide. Do NOT average the daily percentages.\n\n---\n\n## APPENDIX B: GLOSSARY\n\n| Term | Definition |\n|---|---|\n| Polaris Star | The single most important metric the system is optimised for (CPSS for this funnel). |\n| KPI | Key Performance Indicator \u2014 the acceptable threshold for a metric. |\n| CPSS | Cost Per Strategy Session \u2014 total ad spend divided by calls booked. |\n| VCR% | VSL Conversion Rate \u2014 percentage of leads who book a call (bundles App% and AtB%). |\n| App% | Application Rate \u2014 percentage of leads who complete the Typeform application. |\n| AtB% | App-to-Book Rate \u2014 percentage of Typeform applicants who book a call. |\n| LP% | Landing Page conversion rate \u2014 clicks that become leads. |\n| Show% | Show Rate \u2014 percentage of scheduled calls that actually happen. Uses Books Set For Today as denominator, NOT Calls Booked. |\n| Close% | Close Rate \u2014 percentage of conducted calls that produce a new client. |\n| Regression to the Mean | Averages only reveal themselves in large data sets. Small samples produce misleading extremes. |\n| Non-Linear Metric Management | Improving one metric does not linearly improve the next. Changes ripple unpredictably. |\n| Petri Dish Rule | Never modify a working system directly. Duplicate, test, swap only when proven. |\n| Entropy | All systems decay. Creative fatigues, audiences saturate, offers go stale. |\n| Feedback Delay | The time gap between making a change and seeing its impact in data. |\n| Flowing River | A system requires constant fresh input to stay alive. |\n| Creative Fatigue | An ad's performance degrades because the audience has seen it too many times. |\n| Throughput | The flow of value through the system from input to output. |\n| Bottleneck | The single point in the system where throughput is most restricted. |\n| Books Set For Today | Calls SCHEDULED to happen on this day (may have been booked days earlier). |\n| Calls Booked | NEW bookings made on this day (the calls may be for future dates). |\n\n---\n\n*End of SOP v2.0. Load this document into the AI agent's system prompt alongside the Funnel Tracking Sheet CSV for each analysis session.*\n";

function parseCSV(csv){const lines=csv.trim().split("\n"),rows=[];for(let i=1;i<lines.length;i++){const v=[];let c="",q=false;for(const ch of lines[i]){if(ch==='"')q=!q;else if(ch===","&&!q){v.push(c);c="";}else c+=ch;}v.push(c);const p=v[0].trim().split(" ");if(p.length!==3)continue;const date=new Date(+p[2],MM[p[1]],+p[0]);const aS=pG(v[1]),imp=pN(v[2]),rch=pN(v[3]),cl=pN(v[5]),ctr=pP(v[6]),cpc=pG(v[7]),ld=pN(v[8]),lp=pP(v[9]),cpl=pG(v[10]),cb=pN(v[12]),vcr=pP(v[13]),cpss=pG(v[14]),ct=pN(v[16]),nc=pN(v[17]),rev=(function(x){return x!=null?x*USD_TO_GBP:null})(pN(v[18])),ca=(function(x){return x!=null?x*USD_TO_GBP:null})(pN(v[19]));const note=(v[20]||"").trim();const cpm=(aS&&imp)?(aS/imp)*1000:pG(v[4]);const sr=(ct!=null&&cb!=null&&cb>0)?(ct/cb)*100:null;const cr=(nc!=null&&ct!=null&&ct>0)?(nc/ct)*100:null;const aov=(ca!=null&&rev!=null&&rev>0)?(ca/rev)*100:null;const cpsst=(aS&&ct)?aS/ct:null;const cpCl=(aS&&nc)?aS/nc:null;const empty=!aS&&!imp&&!cl&&!ld;rows.push({date,ds:v[0].trim(),adSpend:aS,cpm,impressions:imp,reach:rch,clicks:cl,ctr,cpc,leads:ld,lpPct:lp,cpl,callsBooked:cb,vcrPct:vcr,cpss,showRate:sr,callsTaken:ct,cpsst,closeRate:cr,newClients:nc,cpClient:cpCl,revenue:rev,cash:ca,aov,note,_e:empty});}rows.sort((a,b)=>a.date-b.date);return rows;}
function fillGaps(rows){if(rows.length<2)return rows;const filled=[];const start=rows[0].date,end=rows[rows.length-1].date;const dateMap=new Map();rows.forEach(r=>dateMap.set(r.date.toDateString(),r));for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const key=new Date(d).toDateString();if(dateMap.has(key)){filled.push(dateMap.get(key));}else{const dd=new Date(d);const ds=dd.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dd.getMonth()]+" "+dd.getFullYear();filled.push({date:new Date(dd),ds,adSpend:null,cpm:null,impressions:null,reach:null,clicks:null,ctr:null,cpc:null,leads:null,lpPct:null,cpl:null,callsBooked:null,vcrPct:null,cpss:null,showRate:null,callsTaken:null,cpsst:null,closeRate:null,newClients:null,cpClient:null,revenue:null,cash:null,aov:null,note:"",_e:true});}}return filled;}
function evalCustom(tokens,row){try{const expr=tokens.map(t=>{if(t.type==="metric"){const v=row[t.key];return v!=null?v:"null";}return t.value;}).join("");if(expr.includes("null"))return null;const r=Function('"use strict";return ('+expr+')')();return isFinite(r)?r:null;}catch(e){return null;}}

const DERIVED_METRICS={

  cpm:     {num:"adSpend",    den:"impressions", mult:1000},

function buildDataContext(){
  const f=getFiltered().filter(r=>!r._e);
  const s=summarize(f);

  const notes=f.filter(r=>r.note).map(r=>r.ds+": "+r.note);
  let ctx=`CURRENT VIEW: ${view} | Period: ${dateRange} | ${f.length} active days\n\n`;
  ctx+=`PERIOD SUMMARY:\n`;
  ctx+=`Ad Spend: \u00a3${s.adSpend?.toFixed(0)||'N/A'} | Impressions: ${s.impressions||'N/A'} | Clicks: ${s.clicks||'N/A'}\n`;
  ctx+=`CTR: ${s.ctr?.toFixed(2)||'N/A'}% | CPC: \u00a3${s.cpc?.toFixed(2)||'N/A'} | LP%: ${s.lpPct?.toFixed(2)||'N/A'}%\n`;
  ctx+=`Leads: ${s.leads||'N/A'} | CPL: \u00a3${s.cpl?.toFixed(2)||'N/A'} | VCR%: ${s.vcrPct?.toFixed(2)||'N/A'}%\n`;
  ctx+=`Calls Booked: ${s.callsBooked||'N/A'} | CPSS: \u00a3${s.cpss?.toFixed(2)||'N/A'}\n`;
  ctx+=`Show%: ${s.showRate?.toFixed(1)||'N/A'}% | Calls Taken: ${s.callsTaken||'N/A'}\n`;
  ctx+=`Close%: ${s.closeRate?.toFixed(1)||'N/A'}% | Clients: ${s.newClients||'N/A'}\n`;
  ctx+=`Revenue: \u00a3${s.revenue?.toFixed(0)||'N/A'} | Cash: \u00a3${s.cash?.toFixed(0)||'N/A'}\n`;
  ctx+=`CPM: \u00a3${s.cpm?.toFixed(2)||'N/A'} | Reach: ${s.reach||'N/A'}\n`;
  if(notes.length)ctx+=`\nCHANGE NOTES:\n`+notes.join("\n")+`\n`;
  ctx+=`\nDAILY DATA (last 30 rows or all if fewer):\n`;
  const recent=f.slice(-30);
  ctx+=`Date | Spend | Impr | Clicks | Leads | Booked | Taken | Clients | Revenue | Cash | Note\n`;
  recent.forEach(r=>{ctx+=`${r.ds} | ${r.adSpend||0} | ${r.impressions||0} | ${r.clicks||0} | ${r.leads||0} | ${r.callsBooked||0} | ${r.callsTaken||''} | ${r.newClients||''} | ${r.revenue||''} | ${r.cash||''} | ${r.note||''}\n`;});
  return ctx;
}
async function sendChat(){
  if(chatBusy)return;
  const key=localStorage.getItem("oai_k");
  if(!key){addMsg("sys","Set your OpenAI API key in Settings (\u2699\ufe0f) first.");return;}
  const input=document.getElementById("chatIn").value.trim();
  if(!input)return;
  document.getElementById("chatIn").value="";
  addMsg("user",input);
  chatHistory.push({role:"user",content:input});
  chatBusy=true;document.getElementById("chatSend").disabled=true;
  addMsg("ai","Analysing...");
  try{
    const dataCtx=buildDataContext();
    const sysMsg=AI_SYSTEM_PROMPT+"\n\n---\n\nREFERENCE SOP (use for detailed diagnostic procedures):\n"+AI_SOP+"\n\n---\n\nCURRENT FUNNEL DATA:\n"+dataCtx;
    const msgs=[{role:"system",content:sysMsg},...chatHistory];
    const resp=await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:"gpt-4o",messages:msgs,max_tokens:2000,temperature:0.3})
    });
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.choices[0].message.content;
    chatHistory.push({role:"assistant",content:reply});
    // Remove "Analysing..." and add real reply
    const msgsEl=document.getElementById("chatMsgs");
    msgsEl.removeChild(msgsEl.lastChild);
    addMsg("ai",reply);
  }catch(e){
    const msgsEl=document.getElementById("chatMsgs");
    msgsEl.removeChild(msgsEl.lastChild);
    addMsg("sys","Error: "+e.message);
  }
  chatBusy=false;document.getElementById("chatSend").disabled=false;
}

  realValuesMap={};const avg=getAvg();const hasAvg=avg!=null&&view!=="yearly";const hasRaw=rawOn&&view!=="yearly";
  active.forEach((k,idx)=>{const m=METS.find(x=>x.k===k);if(!m)return;let raw=data.map(r=>getMetricValue(k,r));realValuesMap[k]=raw.slice();const color=getClr(k);const yAxisID=dual?(idx===0?"y":"y1"):"y";
    if(hasAvg){let avgData=rollingMean(data,k,avg.before,avg.after);realValuesMap[k+"_a"]=avgData.slice();let rawN=raw,avgN=avgData;if(isNorm){rawN=normalize(raw);avgN=normalize(avgData);}
      if(hasRaw)datasets.push({label:m.l+" raw",data:isNorm?rawN:raw,borderColor:color+"35",backgroundColor:"transparent",borderWidth:1,pointRadius:0,tension:0.3,yAxisID,spanGaps:false,metricKey:k});
      datasets.push({label:m.l+" avg",data:isNorm?avgN:avgData,borderColor:color,backgroundColor:"transparent",borderWidth:2.5,pointRadius:0,tension:0.3,yAxisID,spanGaps:true,metricKey:k+"_a"});
    }else{let rawN=isNorm?normalize(raw):raw;datasets.push({label:m.l,data:rawN,borderColor:color,backgroundColor:"transparent",borderWidth:2,pointRadius:0,tension:0.3,yAxisID,spanGaps:false,metricKey:k});}
  });
  const scales={x:{ticks:{color:"rgba(255,255,255,0.2)",font:{size:9},maxRotation:30},grid:{color:"rgba(255,255,255,0.03)"}}};
  if(isNorm)scales.y={display:false,min:0,max:100};
  else if(dual){scales.y={position:"left",ticks:{color:"rgba(255,255,255,0.2)",font:{size:9}},grid:{color:"rgba(255,255,255,0.03)"}};scales.y1={position:"right",ticks:{color:"rgba(255,255,255,0.2)",font:{size:9}},grid:{drawOnChartArea:false}};}
  else scales.y={position:"left",ticks:{color:"rgba(255,255,255,0.2)",font:{size:9}},grid:{color:"rgba(255,255,255,0.03)"}};
  chart=new Chart(canvas,{type:"line",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},animation:false,plugins:{legend:{display:false},tooltip:{backgroundColor:"rgba(10,10,15,0.95)",borderColor:"rgba(255,255,255,0.1)",borderWidth:1,titleColor:"rgba(255,255,255,0.5)",bodyColor:"#fff",titleFont:{size:10},bodyFont:{size:11},padding:8,
    callbacks:{label:function(ctx){const mk=ctx.dataset.metricKey;if(!mk)return"";const baseKey=mk.replace("_a","");const m=METS.find(x=>x.k===baseKey);if(!m)return"";const realArr=realValuesMap[mk];const realVal=realArr?realArr[ctx.dataIndex]:ctx.parsed.y;const avg=getAvg();const prefix=mk.endsWith("_a")&&avg?"\u00b7 "+avg.label+" ":"";return prefix+m.l+": "+fmt(realVal,m);}}}},scales}});
}
window.setView=v=>{view=v;selMonthEnd=null;render();};window.setYear=y=>{selYear=y;render();};window.setCustS=v=>{cS=v;render();};window.setCustE=v=>{cE=v;render();};
window.toggle=k=>{const i=active.indexOf(k);if(i>=0)active.splice(i,1);else active.push(k);render();};window.clearAll=()=>{active=[];render();};window.setQuick=keys=>{active=keys.split(",");render();};
document.getElementById("quick").innerHTML=[{l:"CPM vs CTR",k:"cpm,ctr"},{l:"Spend vs Leads",k:"adSpend,leads"},{l:"Leads vs Booked",k:"leads,callsBooked"},{l:"Show vs Close",k:"showRate,closeRate"},{l:"CPL vs LP%",k:"cpl,lpPct"},{l:"Rev vs Cash",k:"revenue,cash"},{l:"Full Funnel",k:"impressions,clicks,leads,callsBooked,newClients"}].map(q=>`<button class="qbtn" onclick="setQuick('${q.k}')">${q.l}</button>`).join("");

function initFromCSV(csv){
  allData=fillGaps(parseCSV(csv));
  months=[...new Set(allData.filter(r=>!r._e).map(r=>r.date.getFullYear()+"-"+String(r.date.getMonth()+1).padStart(2,"0")))].sort();
  years=[...new Set(allData.filter(r=>!r._e).map(r=>""+r.date.getFullYear()))].sort();
  selMonth=months[months.length-1];selYear=years[years.length-1];
  render();
}
(async function init(){
  document.getElementById("empty").textContent="Loading data from Google Sheet\u2026";
  try{
    const csv=await fetchCSV();
    initFromCSV(csv);
  }catch(e){
    console.warn("Live fetch failed, using fallback data:",e);
    initFromCSV(FALLBACK_CSV);
  }
})();
</script>
